name: azurelandingzoneYMALpipeline

trigger:
- main

pool:
  name: Azurecicd

stages:

- stage: CI
  displayName: 'Terraform CI'

  jobs:
  - job: CIWork
    displayName: 'Terraform CI Work'

    steps:

    - checkout: self

    - task: AzureCLI@3
      displayName: 'Azure CLI Login'
      inputs:
        connectionType: 'azureRM'
        azureSubscription: 'shailesh'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: |
          az account show
          az group list --output table

    - task: TerraformInstaller@1
      displayName: 'Terraform Install'
      inputs:
        terraformVersion: 'latest'

    - task: PowerShell@2
      displayName: 'Terraform Init'
      inputs:
        targetType: 'inline'
        script: |
          Set-Location "$(System.DefaultWorkingDirectory)\Parent_Module\dev"

          Write-Host "Working Directory:"
          Get-Location

          Write-Host "Terraform Version:"
          terraform version

          Write-Host "Terraform Init:"

          terraform init `
            -backend-config="storage_account_name=sitterraformstate2026" `
            -backend-config="container_name=tfstate" `
            -backend-config="key=sit.terraform.tfstate" `
            -backend-config="resource_group_name=sit" `
            -backend-config="subscription_id=5ef4ee5d-6bd4-4c27-acc2-af8816fed413" `
            -backend-config="use_azuread_auth=true"

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

    - task: PowerShell@2
      displayName: 'Terraform Validate'
      inputs:
        targetType: 'inline'
        script: |
          Set-Location "$(System.DefaultWorkingDirectory)\Parent_Module\dev"

          terraform validate

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

    - task: PowerShell@2
      displayName: 'Terraform Plan'
      inputs:
        targetType: 'inline'
        script: |
          Set-Location "$(System.DefaultWorkingDirectory)\Parent_Module\dev"

          terraform plan `
            -input=false `
            -out="$(Build.ArtifactStagingDirectory)\tfplan"

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

    - task: PowerShell@2
      displayName: 'Check Terraform Plan File'
      inputs:
        targetType: 'inline'
        script: |
          Write-Host "Checking Terraform plan file..."
          Get-ChildItem "$(Build.ArtifactStagingDirectory)" -Recurse

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Terraform Plan'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)\tfplan'
        ArtifactName: 'terraform-plan'
        publishLocation: 'Container'


- stage: CD
  displayName: 'Terraform CD'
  dependsOn: CI
  condition: succeeded()

  jobs:
  - job: CDWork
    displayName: 'Terraform CD Work'

    steps:

    - checkout: self

    - task: DownloadBuildArtifacts@1
      displayName: 'Download Terraform Plan'
      inputs:
        buildType: 'current'
        downloadType: 'single'
        artifactName: 'terraform-plan'
        downloadPath: '$(Pipeline.Workspace)'

    - task: PowerShell@2
      displayName: 'Check Downloaded Terraform Plan'
      inputs:
        targetType: 'inline'
        script: |
          Write-Host "Downloaded Terraform plan:"
          Get-ChildItem "$(Pipeline.Workspace)" -Recurse

    - task: AzureCLI@3
      displayName: 'Azure CLI Login CD'
      inputs:
        connectionType: 'azureRM'
        azureSubscription: 'shailesh'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: |
          az account show
          az group list --output table

    - task: TerraformInstaller@1
      displayName: 'Terraform Install'
      inputs:
        terraformVersion: 'latest'

    - task: PowerShell@2
      displayName: 'Terraform Init CD'
      inputs:
        targetType: 'inline'
        script: |
          Set-Location "$(System.DefaultWorkingDirectory)\Parent_Module\dev"

          Write-Host "Terraform Version:"
          terraform version

          Write-Host "Terraform Init CD:"

          terraform init `
            -backend-config="storage_account_name=sitterraformstate2026" `
            -backend-config="container_name=tfstate" `
            -backend-config="key=sit.terraform.tfstate" `
            -backend-config="resource_group_name=sit" `
            -backend-config="subscription_id=5ef4ee5d-6bd4-4c27-acc2-af8816fed413" `
            -backend-config="use_azuread_auth=true"

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

    - task: PowerShell@2
      displayName: 'Terraform Apply'
      inputs:
        targetType: 'inline'
        script: |
          Set-Location "$(System.DefaultWorkingDirectory)\Parent_Module\dev"

          terraform apply `
            -input=false `
            "$(Pipeline.Workspace)\terraform-plan\tfplan"

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
